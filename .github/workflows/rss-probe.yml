# TEMPORARY diagnostic: can a GitHub runner read Reddit without credentials?
# Each step's pass/fail encodes one answer. Delete once the question is settled.
name: rss-probe

on:
  push:
    paths: [".github/workflows/rss-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UA: "goat-notification/1.0 (by /u/flamingdrag0n)"
    steps:
      - name: RSS account one returns 200
        run: |
          code=$(curl -s -o /tmp/a.xml -w '%{http_code}' -A "$UA" \
            "https://www.reddit.com/user/Novel_Calendar5168/.rss")
          echo "status=$code bytes=$(wc -c </tmp/a.xml) entries=$(grep -o '<entry>' /tmp/a.xml | wc -l)"
          test "$code" = "200"

      - name: RSS account two returns 200 after 30s gap
        if: always()
        run: |
          sleep 30
          code=$(curl -s -o /tmp/b.xml -w '%{http_code}' -A "$UA" \
            "https://www.reddit.com/user/CSmith20001/.rss")
          echo "status=$code bytes=$(wc -c </tmp/b.xml) entries=$(grep -o '<entry>' /tmp/b.xml | wc -l)"
          test "$code" = "200"

      - name: Plain JSON endpoint returns 200
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" \
            "https://www.reddit.com/user/Novel_Calendar5168/about.json")
          echo "json status=$code"
          test "$code" = "200"
