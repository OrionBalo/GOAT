name: reddit-watch

on:
  schedule:
    # Every 5 minutes at :02, :07, ... :57. Deliberately off the top of the hour:
    # GitHub's own docs name that as the worst window for scheduled-run delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be sent, without sending it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let two runs race each other over the shared state cache.
  group: reddit-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare state directory
        run: mkdir -p .state

      - name: Restore tracking state
        uses: actions/cache/restore@v4
        with:
          path: .state
          # Cache entries are immutable, so each run saves under a fresh key and
          # restore-keys resolves the most recent one by prefix.
          key: reddit-state-${{ github.run_id }}
          restore-keys: |
            reddit-state-

      - name: Check for new activity
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_USERS: ${{ secrets.WATCH_USERS }}
          STATE_PATH: .state/state.json
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m watcher.main

      - name: Save tracking state
        # Runs even when the check failed: items already delivered must not be
        # announced a second time on the next run. The hashFiles guard skips the
        # save when there is no state file at all, so a run that dies before
        # writing one cannot bury good state under an empty cache entry.
        if: always() && hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: reddit-state-${{ github.run_id }}
